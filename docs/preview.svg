<svg xmlns="http://www.w3.org/2000/svg" width="640" height="300" viewBox="0 0 640 300" role="img" aria-label="Five commands, each choosing a scope and a mode, feeding a ledger of proven steps">
  <defs>
    <linearGradient id="ct-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#12161F"/>
      <stop offset="1" stop-color="#0B0E14"/>
    </linearGradient>
    <linearGradient id="ct-accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5AA2FF"/>
      <stop offset="1" stop-color="#F2B25C"/>
    </linearGradient>
  </defs>

  <rect width="640" height="300" fill="url(#ct-bg)"/>

  <!-- command rows -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13">
    <g>
      <rect x="32" y="40" width="316" height="30" rx="8" fill="#1A2130"/>
      <circle cx="50" cy="55" r="3.5" fill="#5AA2FF"/>
      <text x="64" y="60" fill="#E9EEF5">/code-review</text>
      <text x="196" y="60" fill="#8FA3BF" font-size="11">uncommitted → fix</text>
    </g>
    <g>
      <rect x="32" y="80" width="316" height="30" rx="8" fill="#1A2130"/>
      <circle cx="50" cy="95" r="3.5" fill="#5AA2FF"/>
      <text x="64" y="100" fill="#E9EEF5">/code-simplify</text>
      <text x="196" y="100" fill="#8FA3BF" font-size="11">whole project → write</text>
    </g>
    <g>
      <rect x="32" y="120" width="316" height="30" rx="8" fill="#1A2130"/>
      <circle cx="50" cy="135" r="3.5" fill="#5AA2FF"/>
      <text x="64" y="140" fill="#E9EEF5">/code-scrub</text>
      <text x="196" y="140" fill="#8FA3BF" font-size="11">whole project → write</text>
    </g>
    <g>
      <rect x="32" y="160" width="316" height="30" rx="8" fill="#1A2130"/>
      <circle cx="50" cy="175" r="3.5" fill="#F2B25C"/>
      <text x="64" y="180" fill="#E9EEF5">/code-caption</text>
      <text x="196" y="180" fill="#8FA3BF" font-size="11">loop → ledger</text>
    </g>
    <g>
      <rect x="32" y="200" width="316" height="30" rx="8" fill="#1A2130"/>
      <circle cx="50" cy="215" r="3.5" fill="#8FA3BF"/>
      <text x="64" y="220" fill="#E9EEF5">/pua</text>
      <text x="196" y="220" fill="#8FA3BF" font-size="11">protocol → session</text>
    </g>
  </g>

  <!-- flow into the ledger -->
  <path d="M 352 135 C 392 135, 396 135, 428 135" stroke="url(#ct-accent)" stroke-width="2" fill="none" stroke-linecap="round"/>
  <path d="M 421 129 L 429 135 L 421 141" stroke="#F2B25C" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- ledger card -->
  <g>
    <rect x="432" y="52" width="176" height="196" rx="12" fill="#161C27" stroke="#25303F"/>
    <text x="452" y="78" fill="#E9EEF5" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="600">docs/caption/</text>
    <text x="452" y="96" fill="#8FA3BF" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="10">task · criteria · gate</text>

    <g font-family="ui-monospace, Menlo, Consolas, monospace" font-size="10">
      <rect x="452" y="110" width="136" height="26" rx="6" fill="#1E2735"/>
      <circle cx="464" cy="123" r="3" fill="#5AA2FF"/>
      <text x="474" y="127" fill="#C7D3E3">Saw · Decided</text>

      <rect x="452" y="144" width="136" height="26" rx="6" fill="#1E2735"/>
      <circle cx="464" cy="157" r="3" fill="#5AA2FF"/>
      <text x="474" y="161" fill="#C7D3E3">Did · Evidence</text>

      <rect x="452" y="178" width="136" height="26" rx="6" fill="#1E2735"/>
      <circle cx="464" cy="191" r="3" fill="#F2B25C"/>
      <text x="474" y="195" fill="#C7D3E3">Outcome</text>

      <rect x="452" y="212" width="136" height="26" rx="6" fill="#1E2735"/>
      <circle cx="464" cy="225" r="3" fill="#8FA3BF"/>
      <text x="474" y="229" fill="#C7D3E3">unverified</text>
    </g>
  </g>
</svg>
