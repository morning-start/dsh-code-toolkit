name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: evals (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # No dependencies to install: the plugin runs on Node built-ins and the
      # host's services, and the eval suite has no packages either.
      - name: Deterministic eval suite
        run: npm test
